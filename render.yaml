services:
  - type: web
    name: finpilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString

databases:
  - name: finpilot-db
    plan: free
