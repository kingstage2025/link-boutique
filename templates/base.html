<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LinkBoutik{% endblock %}</title>
  <meta name="description" content="Crée ta mini-boutique en ligne gratuitement et vends via WhatsApp.">
  <meta property="og:title" content="{% block og_title %}LinkBoutik{% endblock %}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar"><a class="brand" href="{{ url_for('index') }}">Link<span>Boutik</span></a>
    <nav>{% if g.user %}<a href="{{ url_for('dashboard') }}">Ma boutique</a><form method="post" action="{{ url_for('logout') }}"><button>Déconnexion</button></form>{% else %}<a href="{{ url_for('login') }}">Se connecter</a><a class="button primary" href="{{ url_for('register') }}">Créer ma boutique</a>{% endif %}</nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
